version: '2.4'

name: industrial-iot

services:
  mosquitto:
    image: eclipse-mosquitto:1.4.12@sha256:bb177e7bd81746fc59b919ccb84b6ffffbe1ec1f7f933fa68c3aca4b4be364b6
    platform: linux/amd64
    ports:
      - "20583:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  influxdb:
    image: influxdb:1.3.8@sha256:8c3157245ee6863203cf2f410d026b8e3683b502f9bd967728337ece4c730cc0
    ports:
      - "20586:8086"
    volumes:
      - influx_data:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=industrial_iot

  grafana:
    build: docker/grafana
    image: industrial-iot:grafana-4.6.3
    platform: linux/amd64
    ports:
      - "20530:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

  tests:
    build: .
    image: industrial-iot:tests
    volumes:
      - .:/app
    depends_on:
      - mosquitto
      - influxdb
      - grafana
    command: make check

networks:
  default:
    ipam:
      config:
        - subnet: 172.45.0.0/24

volumes:
  influx_data:
  grafana_data:
