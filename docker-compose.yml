version: '2.4'

name: industrial-iot

# Simulators, gateways, the processor and grafana-init run the code baked into the tests image.
x-app: &app
  build: .
  image: industrial-iot:tests

services:
  mosquitto:
    image: eclipse-mosquitto:1.4.12@sha256:bb177e7bd81746fc59b919ccb84b6ffffbe1ec1f7f933fa68c3aca4b4be364b6
    platform: linux/amd64
    ports:
      - "127.0.0.1:20583:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  influxdb:
    image: influxdb:1.3.8@sha256:8c3157245ee6863203cf2f410d026b8e3683b502f9bd967728337ece4c730cc0
    ports:
      - "127.0.0.1:20586:8086"
    volumes:
      - influx_data:/var/lib/influxdb
      - ./config/influxdb.conf:/etc/influxdb/influxdb.conf:ro
    environment:
      - INFLUXDB_DB=industrial_iot

  grafana:
    build:
      context: .
      dockerfile: docker/grafana/Dockerfile
    image: industrial-iot:grafana-4.6.3
    platform: linux/amd64
    ports:
      - "127.0.0.1:20530:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

  simulator-a:
    <<: *app
    command: python src/node_simulator.py --port 7000 --sensor-id SN-001 --profile normal --interval 1

  simulator-b:
    <<: *app
    command: python src/node_simulator.py --port 7000 --sensor-id SN-101 --profile vibration-drift --interval 1

  gateway-a:
    <<: *app
    command: python src/sensor_gateway.py --config config/gateway.ini
    restart: on-failure
    environment:
      - GATEWAY_ID=gw-a
      - GATEWAY_ZONE=zone-a
      - SERIAL_URL=socket://simulator-a:7000
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto
      - simulator-a

  gateway-b:
    <<: *app
    command: python src/sensor_gateway.py --config config/gateway.ini
    restart: on-failure
    environment:
      - GATEWAY_ID=gw-b
      - GATEWAY_ZONE=zone-b
      - SERIAL_URL=socket://simulator-b:7000
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto
      - simulator-b

  processor:
    <<: *app
    command: python src/data_processor.py --config config/processor.ini
    restart: on-failure
    environment:
      - MQTT_HOST=mosquitto
      - INFLUXDB_HOST=influxdb
    depends_on:
      - mosquitto
      - influxdb

  # One-shot: waits for Grafana's /api/health, then creates the datasource
  # and loads the dashboard. Safe to re-run.
  grafana-init:
    <<: *app
    command: >-
      python scripts/grafana_import.py --url http://grafana:3000
      --user admin --password admin
      --influx-url http://influxdb:8086 --influx-db industrial_iot
      --datasource-name industrial_iot --dashboard grafana/dashboard.json
    restart: "no"
    depends_on:
      - grafana
      - influxdb

  tests:
    build: .
    image: industrial-iot:tests
    # Only started by `make test` (compose run), never by `make up`.
    profiles:
      - test
    volumes:
      - .:/app
    environment:
      - MQTT_HOST=mosquitto
      - INFLUXDB_HOST=influxdb
      - GRAFANA_URL=http://grafana:3000
    depends_on:
      - mosquitto
      - influxdb
      - grafana
    command: make check

networks:
  default:
    ipam:
      config:
        - subnet: 172.45.0.0/24

volumes:
  influx_data:
  grafana_data:
