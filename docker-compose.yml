version: '2'

services:
  mosquitto:
    image: eclipse-mosquitto:1.4
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  influxdb:
    image: influxdb:1.3
    ports:
      - "8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=industrial_iot

  grafana:
    image: grafana/grafana:4.6.0
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  influx_data:
  grafana_data:
